<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PromptCard Settings</title>
<style>
  body { max-width: 560px; margin: 40px auto; font: 14px/1.6 system-ui, sans-serif; background: #101014; color: #e5e7eb; padding: 0 16px; }
  h1 { color: #f97316; letter-spacing: .2em; font-size: 18px; }
  label { display: block; margin: 14px 0 4px; color: #9ca3af; }
  input, select { width: 100%; box-sizing: border-box; background: #1a1a20; border: 1px solid #26262c; color: #e5e7eb; border-radius: 8px; padding: 8px 10px; }
  button { margin-top: 16px; background: #f97316; border: none; color: #fff; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-weight: 600; }
  #msg { margin-left: 10px; color: #4ade80; }
  .hint { color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
  <h1>PROMPTCARD</h1>
  <label id="l-lang">Language</label>
  <select id="lang">
    <option value="en">English</option>
    <option value="tr">Türkçe</option>
  </select>
  <p class="hint" id="hint"></p>
  <label id="l-apiBase">API address (OpenAI-compatible)</label>
  <input id="apiBase" placeholder="https://api.openai.com/v1">
  <label id="l-apiKey">API key</label>
  <input id="apiKey" type="password" placeholder="sk-...">
  <label id="l-model">Model</label>
  <input id="model" placeholder="gpt-4o-mini">
  <button id="save">Save</button><span id="msg"></span>
  <script src="messages.js"></script>
  <script src="options.js"></script>
</body>
</html>
