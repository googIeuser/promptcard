<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>PromptCard Ayarlar</title>
<style>
  body { max-width: 560px; margin: 40px auto; font: 14px/1.6 system-ui, sans-serif; background: #101014; color: #e5e7eb; padding: 0 16px; }
  h1 { color: #f97316; letter-spacing: .2em; font-size: 18px; }
  label { display: block; margin: 14px 0 4px; color: #9ca3af; }
  input { width: 100%; box-sizing: border-box; background: #1a1a20; border: 1px solid #26262c; color: #e5e7eb; border-radius: 8px; padding: 8px 10px; }
  button { margin-top: 16px; background: #f97316; border: none; color: #fff; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-weight: 600; }
  #msg { margin-left: 10px; color: #4ade80; }
  .hint { color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
  <h1>PROMPTCARD</h1>
  <p class="hint">API anahtarı opsiyoneldir. Anahtar yoksa yerleşik yerel analiz motoru tamamen çevrimdışı çalışır. OpenAI uyumlu bir anahtar + model eklersen prompt'lar vision modeli tarafından üretilir.</p>
  <label>API adresi (OpenAI uyumlu)</label>
  <input id="apiBase" placeholder="https://api.openai.com/v1">
  <label>API anahtarı</label>
  <input id="apiKey" type="password" placeholder="sk-...">
  <label>Model</label>
  <input id="model" placeholder="gpt-4o-mini">
  <button id="save">Kaydet</button><span id="msg"></span>
  <script src="options.js"></script>
</body>
</html>
