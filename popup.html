<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #101014; color: #e5e7eb; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #26262c; }
  header b { letter-spacing: .25em; color: #f97316; }
  #settings { margin-left: auto; background: #26262c; color: #e5e7eb; border: 1px solid #3a3a41; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #status { padding: 8px 12px; color: #9ca3af; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px 12px; max-height: 320px; overflow: auto; }
  .cell { background: #1a1a20; border: 1px solid #26262c; border-radius: 8px; padding: 4px; cursor: pointer; }
  .cell:hover { border-color: #f97316; }
  .cell img { width: 100%; height: 64px; object-fit: cover; border-radius: 6px; display: block; background: #000; }
  .cell span { display: block; text-align: center; font-size: 10px; color: #9ca3af; margin-top: 3px; }
</style>
</head>
<body>
  <header><b>PROMPTCARD</b><button id="settings">⚙ Settings</button></header>
  <div id="status">Scanning page…</div>
  <div id="grid"></div>
  <script src="messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
